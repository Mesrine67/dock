name: Release

# Build dock and publish a GitHub Release whenever a version tag is pushed.
#   git tag v0.2.0
#   git push origin v0.2.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to create the release and upload assets

jobs:
  release:
    name: Build & publish release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version tag
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -notmatch '^v[0-9]+\\.[0-9]+\\.[0-9]+
        id: ver
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "dock version: $version"

      # No -G: let CMake pick the newest installed Visual Studio generator, so this
      # keeps working when windows-latest moves from VS 2022 to VS 2026.
      - name: Configure (CMake / MSVC x64)
        run: cmake -S . -B build -A x64 -D DOCK_VERSION=${{ steps.ver.outputs.version }}

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Stage installer input
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/dock.exe dist/ -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source } else { throw "Inno Setup (ISCC.exe) not found on the runner." }
          }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" "packaging\dock.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Prepare checksum for installer
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $setup = "packaging/Output/dock-$version-setup.exe"
          if (-not (Test-Path -LiteralPath $setup)) { throw "Missing installer: $setup" }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash.ToLowerInvariant()
          "$hash  dock-$version-setup.exe" | Set-Content -Encoding ascii "packaging/Output/SHA256SUMS.txt"

      - name: Create draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $tag = "${{ github.ref_name }}"
          $setup = "packaging/Output/dock-$version-setup.exe"
          $checksums = "packaging/Output/SHA256SUMS.txt"
          if (-not (Test-Path -LiteralPath $setup) -or -not (Test-Path -LiteralPath $checksums)) {
            throw "Missing release assets."
          }
          gh release create $tag $setup $checksums --title "dock $version" --generate-notes --draft
          if ($LASTEXITCODE -ne 0) { throw "GitHub release creation failed." }
